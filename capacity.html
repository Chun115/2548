<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>容量</title>
<meta name="description" content="二上單元五練習遊戲：比一比哪杯水多、用杯子當單位比容量、倒過去水會變嗎。答對有獎勵音效，手機平板打開就能玩。">
<meta property="og:type" content="website">
<meta property="og:title" content="容量｜二上單元五練習遊戲">
<meta property="og:description" content="比一比哪杯水多、用杯子當單位比容量、倒過去水會變嗎。答對有獎勵音效，手機平板打開就能玩。">
<meta property="og:image" content="https://chun115.github.io/2548/og-capacity.png">
<meta property="og:url" content="https://chun115.github.io/2548/capacity.html">
<meta name="twitter:card" content="summary_large_image">
</head>
<body>
<script>
/* 容器：w 寬、h 高、level 0~1 水位 */
function cup(x,w,h,level,label){
  const y0=150,top=y0-h,wl=y0-h*level;
  return `<g><rect x="${x}" y="${wl}" width="${w}" height="${y0-wl}" fill="#74c0fc" opacity=".85"/>
  <line x1="${x}" y1="${wl}" x2="${x+w}" y2="${wl}" stroke="#1c7ed6" stroke-width="2"/>
  <path d="M${x},${top} L${x},${y0} L${x+w},${y0} L${x+w},${top}" fill="none" stroke="#495057" stroke-width="4" stroke-linejoin="round"/>
  <text x="${x+w/2}" y="${y0+26}" text-anchor="middle" font-size="20" font-weight="900" font-family="Noto Sans TC">${label}</text></g>`;
}
function scene(parts){return `<svg viewBox="0 0 320 185" style="width:min(88vw,360px);height:auto">${parts}</svg>`;}
const G1='🥛';
window.GAME={
  title:'容量',emoji:'🥤',sub:'二上・單元五：認識容量、容量的比較',color:'#0c8599',bg:'#ebfbfd',line:'#c5ecf1',
  modes:[
    {id:'direct',icon:'👀',name:'哪杯水比較多？',desc:'一樣的杯子，看水的高度'},
    {id:'units',icon:'🥛',name:'用杯子來比',desc:'倒了幾杯？誰裝得多？多幾杯？'},
    {id:'keep',icon:'🔁',name:'倒過去會變嗎？',desc:'換一個杯子，水會變多還是變少？'},
  ],
  speedStars:[6,10,14],
  make(m){
    if(m==='direct'){
      const k=R(2);
      if(k===0){ // 同樣杯子不同水位
        let a=RI(3,9)/10,b=RI(3,9)/10;if(Math.random()<.2)b=a;
        const ans=a>b?'甲':a<b?'乙':'一樣多';
        return {prompt:'兩個一樣的杯子，<br>哪一杯的水比較多？',visual:scene(cup(55,80,120,a,'甲')+cup(185,80,120,b,'乙')),ans,
          opts:[{v:'甲',t:'甲'},{v:'乙',t:'乙'},{v:'一樣多',t:'一樣多'}],miss:ans==='一樣多'?'杯子一樣，水的高度一樣，<b>一樣多</b>':`杯子一樣，水比較高的 <b>${ans}</b> 比較多`};
      }
      // 水位一樣高、杯子粗細不同
      const lv=RI(5,8)/10;const fat=Math.random()<.5;
      return {prompt:'水的高度一樣，<br>哪一杯的水比較多？',visual:scene(fat?cup(40,120,110,lv*110/110,'甲')+cup(210,55,110,lv,'乙'):cup(40,55,110,lv,'甲')+cup(170,120,110,lv,'乙')),
        ans:fat?'甲':'乙',opts:[{v:'甲',t:'甲'},{v:'乙',t:'乙'},{v:'一樣多',t:'一樣多'}],miss:`高度一樣，但 <b>${fat?'甲':'乙'}</b> 的杯子比較粗，水比較多`};
    }
    if(m==='units'){
      const a=RI(3,9);let b=RI(3,9);if(b===a)b=a+(a<9?1:-1);const k=R(3);
      const vis=`<div style="text-align:left;line-height:2;font-size:22px;font-weight:900">甲瓶 ${G1.repeat(a)}<br>乙瓶 ${G1.repeat(b)}</div>`;
      if(k===0)return {prompt:'把兩瓶水倒進一樣的杯子，<br>哪一瓶的水比較多？',visual:vis,ans:a>b?'甲':'乙',opts:[{v:'甲',t:'甲瓶'},{v:'乙',t:'乙瓶'},{v:'一樣多',t:'一樣多'}],miss:`甲 ${a} 杯、乙 ${b} 杯，<b>${a>b?'甲':'乙'}瓶</b>比較多`};
      if(k===1){const d=Math.abs(a-b);return {prompt:`${a>b?'甲':'乙'}瓶比${a>b?'乙':'甲'}瓶多幾杯？`,visual:vis,ans:d,opts:numOpts(d,[a+b,Math.max(a,b)],' 杯',1),miss:`${Math.max(a,b)} − ${Math.min(a,b)} = <b>${d} 杯</b>`};}
      // 杯子大小不同
      return {prompt:`甲瓶倒滿 ${a} <b>大杯</b>，乙瓶倒滿 ${a+RI(1,3)} <b>小杯</b>。<br>可以說乙瓶裝得比較多嗎？`,ans:'不可以',
        opts:[{v:'可以',t:'可以'},{v:'不可以',t:'不可以'}],miss:'杯子大小不一樣，不能只看杯數，要用<b>一樣的杯子</b>才能比'};
    }
    // keep：保留概念
    const k=R(2);
    if(k===0){const to=pick(['又高又細的瓶子','又矮又胖的碗','一個大水桶']);
      return {prompt:`把一杯水全部倒進${to}，<br>水的量會怎樣？`,ans:'一樣多',opts:[{v:'變多',t:'變多'},{v:'變少',t:'變少'},{v:'一樣多',t:'一樣多'}],miss:'水沒有加也沒有倒掉，換了容器還是<b>一樣多</b>'};}
    const lv=.5;
    return {prompt:'兩杯一樣多的水，乙倒進細長的杯子後<br>水變高了。哪一杯水比較多？',visual:scene(cup(40,110,110,.45,'甲')+cup(215,50,140,.71,'乙')),ans:'一樣多',
      opts:[{v:'甲',t:'甲'},{v:'乙',t:'乙'},{v:'一樣多',t:'一樣多'}],miss:'只是換了杯子，水變高但沒有變多，還是<b>一樣多</b>'};
  }
};
</script>
<script src="engine.js?v=5"></script>
<script src="zhuyin.js?v=5"></script>
</body>
</html>
