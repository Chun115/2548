<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>二年級數學遊戲屋</title>
<meta name="description" content="國小二年級上學期數學練習小遊戲，依單元排列：200以內的數、加減法、公分、容量、乘法、時間、面的大小比較。答對有獎勵音效，手機平板打開就能玩。">
<meta property="og:type" content="website">
<meta property="og:title" content="二年級數學遊戲屋｜二上全單元練習遊戲">
<meta property="og:description" content="依單元排列：200以內的數、加減法、公分、容量、乘法、時間、面的大小比較。答對有獎勵音效，手機平板打開就能玩。">
<meta property="og:image" content="https://chun115.github.io/2548/og-home.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://chun115.github.io/2548/">
<meta name="twitter:card" content="summary_large_image">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff7e8;--ink:#2b2340;--soft:#6b6280;--line:#efe3cc}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",system-ui,sans-serif;display:flex;justify-content:center;padding:28px 14px 40px}
.wrap{width:100%;max-width:560px}
h1{font-size:32px;font-weight:900;margin:0 0 4px;text-align:center}
.sub{color:var(--soft);text-align:center;margin:0 0 22px;font-size:15px}
.list{display:grid;gap:12px}
a.game{display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit;background:#fff;border:3px solid var(--line);border-radius:22px;padding:12px 16px;box-shadow:0 5px 0 var(--line);transition:.15s}
a.game:hover{transform:translateY(-2px)}
a.game:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.icon{flex:none;width:62px;height:62px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:32px}
.num{display:grid;grid-template-columns:1fr 1fr;gap:2px;width:46px;height:46px}
.num span{display:flex;align-items:center;justify-content:center;border-radius:6px;font-size:17px;font-weight:900;color:#fff}
.unit{display:inline-block;font-size:12px;font-weight:900;color:#fff;border-radius:999px;padding:1px 9px;margin-bottom:3px}
.info b{display:block;font-size:18px}
.info span.d{color:var(--soft);font-size:13px;line-height:1.4}
.go{margin-left:auto;font-size:24px;color:#c9bca3}
.foot{text-align:center;color:var(--soft);font-size:13px;margin-top:22px;line-height:1.7}
</style>
</head>
<body>
<div class="wrap">
  <h1>🏠 二年級數學遊戲屋</h1>
  <p class="sub">二上數學，一個單元一個遊戲，點一個開始玩！</p>

  <div class="list" id="list"></div>

  <p class="foot">🎵 答對有獎勵音效，請把手機的靜音關掉<br>手機、平板、電腦都能玩</p>
</div>
<script>
const NUM=(d)=>`<div class="num">${d.split('').map((c,i)=>`<span style="background:${['#ff7a59','#2bb3a3','#5b7cfa','#f2b705'][i]}">${c}</span>`).join('')}</div>`;
const G=[
 ['num200.html','單元一','200 以內的數','數積木、位值、付錢、比大小','🧱','#f76707','#fff0e3'],
 ['addsub.html','單元二','二位數的加減法','直式加法、減法、＝＞＜','➕','#1c7ed6','#e7f1fc'],
 ['cm.html','單元三','認識公分','量一量、長度加減、個別單位','📏','#e8590c','#fff0e3'],
 ['relation.html','單元四','加減應用','加減關係、找□、驗算','🔄','#7048e8','#f0ebff'],
 ['capacity.html','單元五','容量','哪杯水多？用杯子比一比','🥤','#0c8599','#e3f8fa'],
 ['twostep.html','單元六','加減兩步驟','連加、連減、加減混合','🚌','#d6336c','#ffe8f1'],
 ['2548.html','單元七','乘法（一）','2、5、4、8 的乘法',NUM('2548'),'#f08c00','#fff3e0'],
 ['clock.html','單元八','時間','認識鐘面、幾時幾分、經過多久','🕐','#2b8a3e','#e6f5e9'],
 ['3679.html','單元九','乘法（二）','3、6、7、9 的乘法',NUM('3679'),'#f08c00','#fff3e0'],
 ['area.html','單元十','面的大小比較','疊一疊、數格子比大小','🟩','#2f9e44','#e6f5e9'],
];
document.getElementById('list').innerHTML=G.map(([h,u,t,d,ic,c,bg])=>`<a class="game" href="${h}">
  <div class="icon" style="background:${bg}">${ic}</div>
  <div class="info"><span class="unit" style="background:${c}">${u}</span><b>${t}</b><span class="d">${d}</span></div>
  <div class="go">›</div></a>`).join('');
</script>
</body>
</html>
